# =============================================================================
# GraspFinder Test Configuration (with Debug Output)
# =============================================================================
# This YAML file is configured for testing the grasp sampling pipeline
# with detailed debug output enabled.
#
# Workpiece: 250mm x 250mm x 250mm cube
# Gripper: Parallel gripper with 60mm-360mm opening range
#
# Coordinate system: All poses and dimensions are in meters and radians.
# Frame: world
# =============================================================================

/**:
  ros__parameters:
    frame_id: 'world'

    # =========================================================================
    # Primary Workpiece (the part to be grasped)
    # =========================================================================
    # Using cube workpiece URDF: 250mm x 250mm x 250mm
    # The workpiece is placed so its center is at z=0.125m (bottom at z=0)
    primary:
      urdf_path: 'config/cube_workpiece.urdf'
      
      # Transform from URDF origin to world frame
      # Place the workpiece directly on ground plane
      # (ground at z=0, cube center at z=0.125m so bottom is at z=0)
      transform:
        translation:
          x: 0.0
          y: 0.0
          z: 0.125
        rotation:
          x: 0.0
          y: 0.0
          z: 0.0
          w: 1.0

    # =========================================================================
    # Gripper Configuration
    # =========================================================================
    # Test gripper with gripper_metadata:
    # - Fingers: 30x40x200mm
    # - Opening range: 60mm (closed) to 360mm (fully open)
    # - TCP: 120mm below base
    gripper:
      urdf_path: 'config/test_gripper.urdf'
      
      # Override max opening limit for this test
      # Cube is 250mm on all sides - well within gripper range
      max_opening: 0.36    # 360mm - fully open

    # =========================================================================
    # Secondary Shapes (fixtures, ground, obstacles)
    # =========================================================================
    # These are collision objects the gripper must avoid.
    secondaries:
      # Ground plane at z=0
      - id: 'ground_plane'
        type: 'ground_plane'
        size_x: 3.0
        size_y: 3.0
        z_position: 0.0

      # Table surface just below the workpiece
      - id: 'table_surface'
        type: 'box'
        dimensions:
          x: 1.2
          y: 1.0
          z: 0.05
        transform:
          translation:
            x: 0.0
            y: 0.0
            z: 0.475    # Table top at 0.5m, thickness 0.05m, so center at 0.475m
          rotation:
            x: 0.0
            y: 0.0
            z: 0.0
            w: 1.0

    # =========================================================================
    # Exclusion Zones (welds, screws, forbidden areas)
    # =========================================================================
    # Define regions where the gripper CANNOT contact.
    # Uncomment sections below to test exclusion zone logic.
    
    # Example: Weld points on top surface
    # exclusion_zones:
    #   circles:
    #     - id: 'weld_point_1'
    #       center:
    #         x: 0.05
    #         y: 0.0
    #         z: 0.75    # Top surface at z = 0.625 + 0.125 = 0.75
    #       normal:
    #         x: 0.0
    #         y: 0.0
    #         z: 1.0
    #       radius: 0.02       # 20mm radius exclusion
    #       projection_depth: 0.05
    #       clearance: 0.01
    #
    #     - id: 'weld_point_2'
    #       center:
    #         x: -0.05
    #         y: 0.0
    #         z: 0.75
    #       normal:
    #         x: 0.0
    #         y: 0.0
    #         z: 1.0
    #       radius: 0.02
    #       projection_depth: 0.05
    #       clearance: 0.01

    # =========================================================================
    # Sampling Configuration
    # =========================================================================
    sampling:
      # Surface pairing constraints
      # Normals must be nearly antiparallel (160°-180° = opposing faces)
      min_angle_deg: 160.0
      max_angle_deg: 180.0
      
      # Gripper opening range (must match gripper limits above)
      min_gripper_opening: 0.06    # 60mm
      max_gripper_opening: 0.36    # 360mm
      
      # Sampling density - 10mm grid for testing (lower = more samples)
      sample_density: 0.02         # 20mm grid for faster testing
      
      # Normal sampling density for curved surfaces
      normal_sample_density: 1.0
      
      # Validation thresholds
      max_lateral_deviation: 0.03  # 30mm diagonal tolerance
      alignment_threshold: 0.95    # ~18° alignment tolerance

    # =========================================================================
    # Orientation Finding Configuration
    # =========================================================================
    orientation:
      # Finger dimensions (from gripper URDF)
      finger_length: 0.20          # 200mm finger length
      finger_radius: 0.02          # 20mm finger radius (half of 40mm width)

      # Edge-based orientation finding
      max_edge_candidates: 5       # Check more edges for thorough testing
      dual_seed_dedup_tolerance_deg: 3.0
      max_edges_per_contact: 0     # 0 = unlimited

      # Angle offsets to test around each edge direction
      # More angles = more thorough but slower
      angle_offsets: [-30.0, -15.0, 0.0, 15.0, 30.0]

      # Search behavior
      stop_on_first_valid: false   # Find ALL valid grasps for testing

      # Collision tolerance (1mm)
      collision_tolerance: 0.001

    # =========================================================================
    # Kissing Surface Configuration
    # =========================================================================
    kissing:
      # Surfaces with >80% contact with secondaries are banned
      contact_threshold: 0.8

    # =========================================================================
    # FCL Configuration
    # =========================================================================
    fcl:
      enabled: true
      triangulation_deflection: 0.001   # 1mm precision for testing

    # =========================================================================
    # Output Configuration
    # =========================================================================
    output:
      json_path: 'grasps/grasps.json'
      max_grasps: 100              # Return up to 100 grasps
      min_quality: 0.0             # Return all grasps regardless of quality
      include_debug: true          # Include debug info in JSON output