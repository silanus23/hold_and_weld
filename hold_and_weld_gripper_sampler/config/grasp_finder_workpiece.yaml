# =============================================================================
# GraspFinder Configuration — Large Workpiece Slab (Start Position)
# =============================================================================
# Workpiece: workpiece.urdf.xacro — 800mm × 400mm × 300mm steel slab
# Start pose from objects.yaml: center at (1.2, -0.5, 0.65)
#   → occupies x ∈ [0.8, 1.6], y ∈ [-0.7, -0.3], z ∈ [0.5, 0.8]
# Gripper: test_gripper.urdf — 60mm–360mm opening, 200mm fingers
#
# Graspable surface pairs:
#   Long sides (800×300mm):  y = -0.3 vs y = -0.7  → 400mm apart  ✓
#   Short sides (400×300mm): x = 0.8  vs x = 1.6   → 800mm apart  ✗ (too wide)
#   Top/bottom (800×400mm):  z = 0.5  vs z = 0.8   → 300mm apart  ✓
#
# The 400mm side separation is within the 360mm gripper range. The 800mm
# length separation is not — those pairs will be filtered out by sampling.
# The 300mm top/bottom separation is also within range.
#
# Coordinate system: meters / quaternion. Frame: world.
# =============================================================================

/**:
  ros__parameters:
    frame_id: 'world'

    # =========================================================================
    # Primary Workpiece
    # =========================================================================
    # 800×400×300 mm box. URDF origin is at the geometric center.
    # Translation puts the center at (1.2, -0.5, 0.65).
    primary:
      urdf_path: 'config/test_workpiece.urdf'
      transform:
        translation:
          x: 1.2
          y: -0.5
          z: 0.65
        rotation:
          x: 0.0
          y: 0.0
          z: 0.0
          w: 1.0

    # =========================================================================
    # Gripper
    # =========================================================================
    # Fingers: 30×40×200 mm.  Opening: 60 mm (closed) → 360 mm (fully open).
    # The 400mm face separation is the primary grasp target.
    gripper:
      urdf_path: 'config/test_gripper.urdf'
      max_opening: 0.36    # 360 mm

    # =========================================================================
    # Secondary Shapes (collision obstacles)
    # =========================================================================
    secondaries:
      # Ground plane — bans surfaces at z = 0.0 (well below the slab bottom
      # at z = 0.5, but kept here to handle the ground the slab rests on).
      - id: 'ground_plane'
        type: 'ground_plane'
        size_x: 4.0
        size_y: 4.0
        z_position: 0.0

      # The slab sits on a table/support surface. Model it as a box so the
      # bottom face (z = 0.5) is correctly banned by the kissing constraint.
      # Table top at z = 0.5, 10 mm thick → center at z = 0.495.
      - id: 'support_table'
        type: 'box'
        dimensions:
          x: 2.0
          y: 1.5
          z: 0.01
        transform:
          translation:
            x: 1.2
            y: -0.5
            z: 0.495
          rotation:
            x: 0.0
            y: 0.0
            z: 0.0
            w: 1.0

    # =========================================================================
    # Exclusion Zones
    # =========================================================================
    # None defined for the bare slab. Add weld seam lines below if needed:
    #
    # exclusion_zones:
    #   lines:
    #     - id: 'weld_seam_top'
    #       start: { x: 0.9,  y: -0.5, z: 0.80 }
    #       end:   { x: 1.5,  y: -0.5, z: 0.80 }
    #       exclusion_radius: 0.015
    #       clearance: 0.01

    # =========================================================================
    # Sampling
    # =========================================================================
    sampling:
      # Opposing flat faces are perfectly anti-parallel (180°).
      min_angle_deg: 160.0
      max_angle_deg: 180.0

      # Target: 400mm face separation (long-side grasps) and
      #         300mm face separation (top/bottom grasps).
      # 60mm min keeps fingers clear of edges on the 400mm faces.
      min_gripper_opening: 0.06    # 60 mm
      max_gripper_opening: 0.36    # 360 mm — captures both 300mm and 400mm pairs

      # 20mm grid on large faces keeps sampling time reasonable.
      sample_density: 0.02

      normal_sample_density: 1.0
      max_lateral_deviation: 0.04   # 40 mm — wider slab needs slightly more tolerance
      alignment_threshold: 0.95

    # =========================================================================
    # Orientation Finding
    # =========================================================================
    orientation:
      finger_length: 0.20            # 200 mm
      finger_radius: 0.02            # 20 mm (half of 40 mm width)

      max_edge_candidates: 5
      dual_seed_dedup_tolerance_deg: 3.0
      max_edges_per_contact: 0       # unlimited

      # Five offsets give thorough coverage on the long rectangular faces.
      angle_offsets: [-30.0, -15.0, 0.0, 15.0, 30.0]

      stop_on_first_valid: false
      collision_tolerance: 0.001     # 1 mm

    # =========================================================================
    # Kissing Surface
    # =========================================================================
    kissing:
      contact_threshold: 0.8        # >80 % contact → banned

    # =========================================================================
    # FCL
    # =========================================================================
    fcl:
      enabled: true
      triangulation_deflection: 0.001   # 1 mm — box geometry doesn't need finer

    # =========================================================================
    # Output
    # =========================================================================
    output:
      max_grasps: 100               # More grasps — large part has many valid candidates
      min_quality: 0.0
      include_debug: true