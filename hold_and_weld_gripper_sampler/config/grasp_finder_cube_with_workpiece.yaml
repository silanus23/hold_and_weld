# =============================================================================
# GraspFinder Configuration — Cube Workpiece + Workpiece Obstacle
# =============================================================================
# Primary:   cube.urdf.xacro — 250 × 250 × 250 mm
#            Start pose (objects.yaml): center at (1.2, 0.3, 0.125)
#            Bottom face sits flush on z = 0.0 (ground plane)
#
# Obstacles:
#   1. ground_plane  — bans the bottom face of the cube (z = 0.0)
#   2. workpiece_obstacle.urdf — 800 × 400 × 300 mm steel workpiece
#            World-frame center: (1.2, -0.5, 0.65)
#            Occupies x ∈ [0.80, 1.60], y ∈ [-0.70, -0.30], z ∈ [0.50, 0.80]
#
# Gripper:   test_gripper.urdf — 60 mm (closed) → 360 mm (open), 200 mm fingers
#
# Coordinate system: meters / quaternion. Frame: world.
# =============================================================================

/**:
  ros__parameters:
    frame_id: 'world'

    # =========================================================================
    # Primary Workpiece — cube (child_link)
    # =========================================================================
    # URDF origin is at the geometric center of the cube.
    # Translation places the center at (1.2, 0.3, 0.125) so the bottom
    # face sits exactly on z = 0.0.
    primary:
      urdf_path: 'config/cube_workpiece.urdf'
      transform:
        translation:
          x: 1.2
          y: 0.3
          z: 0.125
        rotation:
          x: 0.0
          y: 0.0
          z: 0.0
          w: 1.0

    # =========================================================================
    # Gripper
    # =========================================================================
    # Fingers: 30 × 40 × 200 mm.  Opening: 60 mm (closed) → 360 mm (fully open).
    # The cube is 250 mm wide — well within the opening range.
    gripper:
      urdf_path: 'config/test_gripper.urdf'
      max_opening: 0.36    # 360 mm

    # =========================================================================
    # Secondary Shapes (collision obstacles)
    # =========================================================================
    secondaries:
      # --- Ground plane -------------------------------------------------------
      # Bans the bottom face of the cube (z = 0.0) and rejects any grasp
      # whose fingers would dip below the floor.
      - id: 'ground_plane'
        type: 'ground_plane'
        size_x: 3.0
        size_y: 3.0
        z_position: 0.0

      # --- Base workpiece (base_link) -----------------------------------------
      # 800 × 400 × 300 mm steel workpiece sitting next to the cube.
      # World-frame center: (1.2, -0.5, 0.65) — matches objects.yaml.
      # Represented as a 'urdf' secondary so ShapeLoader reads the plain URDF
      # directly (no xacro expansion needed).
      - id: 'base_workpiece'
        type: 'urdf'
        urdf_path: 'config/workpiece_obstacle.urdf'
        transform:
          translation:
            x: 1.2
            y: -0.5
            z: 0.65
          rotation:
            x: 0.0
            y: 0.0
            z: 0.0
            w: 1.0

    # =========================================================================
    # Exclusion Zones
    # =========================================================================
    # None defined — add weld-point circles here when seam locations are known.

    # =========================================================================
    # Sampling
    # =========================================================================
    sampling:
      # Opposing faces of a cube are perfectly anti-parallel (180°).
      min_angle_deg: 160.0
      max_angle_deg: 180.0

      # Cube side = 250 mm. 60 mm minimum keeps fingers inside the face.
      min_gripper_opening: 0.06    # 60 mm
      max_gripper_opening: 0.36    # 360 mm — allow full range

      # 15 mm grid: fast enough, fine enough for a 250 mm face.
      sample_density: 0.015

      normal_sample_density: 1.0
      max_lateral_deviation: 0.03   # 30 mm diagonal tolerance
      alignment_threshold: 0.95

    # =========================================================================
    # Orientation Finding
    # =========================================================================
    orientation:
      finger_length: 0.20            # 200 mm — matches test_gripper finger length
      finger_radius: 0.02            # 20 mm — half of 40 mm finger width

      max_edge_candidates: 5
      dual_seed_dedup_tolerance_deg: 3.0
      max_edges_per_contact: 0       # 0 = unlimited

      # Three offsets give good angular coverage around each edge seed.
      angle_offsets: [-15.0, 0.0, 15.0]

      stop_on_first_valid: false
      collision_tolerance: 0.001     # 1 mm

    # =========================================================================
    # Kissing Surface
    # =========================================================================
    kissing:
      contact_threshold: 0.8        # > 80 % contact area → surface banned

    # =========================================================================
    # FCL Collision Checking
    # =========================================================================
    fcl:
      enabled: true
      triangulation_deflection: 0.001   # 1 mm — sufficient for box geometry

    # =========================================================================
    # Output
    # =========================================================================
    output:
      max_grasps: 50
      min_quality: 0.0
