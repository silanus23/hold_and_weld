
/**:
  ros__parameters:
    frame_id: 'world'

    primary:
      step_path: 'meshes/workpiece.step'

      transform:
        translation:
          x: 1.2
          y: -0.5
          z: 0.65
        rotation:
          x: 0.0
          y: 0.0
          z: 0.0
          w: 1.0

    gripper:
      urdf_path: 'urdf/grippers/parallel_gripper.urdf.xacro'

    secondaries:
      - id: 'ground_plane'
        type: 'ground_plane'
        size_x: 2.0
        size_y: 2.0
        z_position: 0.0

      - id: 'fixture_1'
        type: 'step'
        step_path: 'meshes/fixture.step'
        transform:
          translation:
            x: 1.0
            y: -0.5
            z: 0.0
          rotation:
            x: 0.0
            y: 0.0
            z: 0.0
            w: 1.0

      - id: 'support_block'
        type: 'box'
        dimensions:
          x: 0.1
          y: 0.1
          z: 0.3
        transform:
          translation:
            x: 1.2
            y: -0.3
            z: 0.15
          rotation:
            x: 0.0
            y: 0.0
            z: 0.0
            w: 1.0

    exclusion_zones:
      circles:
        - id: 'weld_point_1'
          center:
            x: 1.25
            y: -0.45
            z: 0.70
          normal:
            x: 0.0
            y: 0.0
            z: 1.0
          radius: 0.015
          projection_depth: 0.05
          clearance: 0.01

        - id: 'screw_hole_1'
          center:
            x: 1.15
            y: -0.55
            z: 0.70
          normal:
            x: 0.0
            y: 0.0
            z: 1.0
          radius: 0.008
          projection_depth: 0.03
          clearance: 0.005

      polygons:
        - id: 'label_area'
          corners:
            - { x: 1.10, y: -0.40, z: 0.70 }
            - { x: 1.20, y: -0.40, z: 0.70 }
            - { x: 1.20, y: -0.35, z: 0.70 }
            - { x: 1.10, y: -0.35, z: 0.70 }
          projection_depth: 0.02
          clearance: 0.005

      lines:
        - id: 'weld_seam_1'
          start:
            x: 1.10
            y: -0.50
            z: 0.65
          end:
            x: 1.30
            y: -0.50
            z: 0.65
          exclusion_radius: 0.012
          projection_depth: 0.04
          clearance: 0.008

    mesh_deflection:
      linear: 0.001
      angular: 0.1

    sampling:
      min_angle_deg: 160.0
      max_angle_deg: 180.0
      min_gripper_opening: 0.02
      max_gripper_opening: 0.15

      sample_density: 0.01
      normal_sample_density: 1.0

      max_lateral_deviation: 0.02
      alignment_threshold: 0.95

    orientation:
      finger_length: 0.10
      finger_radius: 0.02

      max_edge_candidates: 5
      dual_seed_dedup_tolerance_deg: 3.0
      max_edges_per_contact: 0

      angle_offsets: [-15.0, 0.0, 15.0]

      stop_on_first_valid: false

      collision_tolerance: 0.001

    kissing:
      contact_threshold: 0.8

    fcl:
      enabled: true
      triangulation_deflection: 0.0001

    output:
      json_path: 'results/grasps.json'

      max_grasps: 50

      min_quality: 0.0
