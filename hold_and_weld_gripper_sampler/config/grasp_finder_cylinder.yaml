# =============================================================================
# GraspFinder Configuration — Cylinder Workpiece (Start Position)
# =============================================================================
# Workpiece: cylinder.urdf.xacro — radius=225mm, height=250mm
#
# Assumed start pose: center at (1.2, 0.0, 0.125)
#   → flat circular faces at z = 0.0 (bottom, on ground) and z = 0.25 (top)
#   → cylinder axis along Z, full diameter = 450mm
#
# Graspable surface pairs (gripper max opening = 360mm):
#   Curved side vs curved side: diameter = 450mm → EXCEEDS gripper range ✗
#   Top flat face vs curved side: not antipodal ✗
#   Top flat vs bottom flat: 250mm apart ✓ — but bottom is banned by ground
#
# Reality check:
#   A 450mm diameter cylinder cannot be gripped across its diameter with a
#   360mm max opening gripper. The sampler will correctly find NO valid
#   opposing surface pairs on the curved surface.
#
#   The only geometry the sampler CAN work with is the ShapeRefiner splitting
#   the curved surface into arc patches, then checking if any two opposing
#   patches are within 360mm of each other — which for a 450mm cylinder they
#   are NOT (chord distance at any antipodal pair = diameter = 450mm).
#
#   This config is intentionally kept here as a realistic "no valid grasp"
#   test case to verify the pipeline handles that gracefully, AND to serve
#   as the starting point if the gripper or cylinder dimensions change.
#
# ShapeRefiner is critical here: without it the cylinder is a single curved
# face and no surface pair can be formed. With it, the curved surface is
# split into arc patches which are then checked against each other.
#
# Coordinate system: meters / quaternion. Frame: world.
# =============================================================================

/**:
  ros__parameters:
    frame_id: 'world'

    # =========================================================================
    # Primary Workpiece
    # =========================================================================
    # Cylinder: radius=225mm, height=250mm. URDF origin is at the geometric
    # center of the cylinder. Translation puts the center at (1.2, 0.0, 0.125)
    # so the bottom circular face sits flush on z = 0.
    primary:
      urdf_path: 'config/cylinder_workpiece.urdf'
      transform:
        translation:
          x: 1.2
          y: 0.0
          z: 0.125
        rotation:
          x: 0.0
          y: 0.0
          z: 0.0
          w: 1.0

    # =========================================================================
    # Gripper
    # =========================================================================
    # Fingers: 30×40×200mm. Opening: 60mm (closed) → 360mm (fully open).
    # The cylinder diameter (450mm) exceeds the gripper range — expect 0 grasps
    # on the curved surface. Top/bottom flat pair (250mm) is within range but
    # the bottom face is banned by the ground plane.
    gripper:
      urdf_path: 'config/test_gripper.urdf'
      max_opening: 0.36    # 360mm

    # =========================================================================
    # Secondary Shapes (collision obstacles)
    # =========================================================================
    secondaries:
      # Ground plane at z = 0 — bans the bottom circular face and prevents
      # the gripper from descending below the floor.
      - id: 'ground_plane'
        type: 'ground_plane'
        size_x: 4.0
        size_y: 4.0
        z_position: 0.0

    # =========================================================================
    # Shape Refiner
    # =========================================================================
    # NOTE: ShapeRefinerConfig is NOT parsed from YAML by ConfigParser.
    # The refiner always runs with its hardcoded defaults from GraspFinderConfig:
    #   enabled               = true
    #   max_cylinder_radius   = 0.100 m   ← smaller than our 0.225m cylinder,
    #                                        so the curved surface WILL be split
    #   max_arc_length        = 0.200 m
    #   enclave_area_ratio    = 0.005
    #   enclave_angle_threshold = 45.0°
    #
    # The default max_cylinder_radius (100mm) is already smaller than this
    # cylinder's radius (225mm), so arc-patch splitting will trigger
    # automatically without any config change needed.
    #
    # If you need to tune these values, modify GraspFinderConfig defaults
    # in grasp_finder.hpp or add a shape_refiner parser to config_parser.cpp.


    # =========================================================================
    # Exclusion Zones
    # =========================================================================
    # None defined. Add weld seam or feature exclusions here if needed:
    #
    # exclusion_zones:
    #   circles:
    #     - id: 'top_center_feature'
    #       center:   { x: 1.2, y: 0.0, z: 0.25 }
    #       normal:   { x: 0.0, y: 0.0, z: 1.0  }
    #       radius: 0.03
    #       projection_depth: 0.02
    #       clearance: 0.01

    # =========================================================================
    # Sampling
    # =========================================================================
    sampling:
      # Arc patches on a cylinder have normals that diverge from perfectly
      # anti-parallel. Widen the angle window slightly to catch near-antipodal
      # patch pairs after refinement.
      min_angle_deg: 155.0
      max_angle_deg: 180.0

      # Cylinder diameter = 450mm — outside gripper range.
      # Keep min at 60mm and max at 360mm so the sampler correctly finds no
      # valid pairs rather than crashing on an empty result.
      min_gripper_opening: 0.06    # 60mm
      max_gripper_opening: 0.36    # 360mm

      # 15mm grid. Arc patches after refinement are roughly 200mm × 250mm,
      # giving ~13×16 samples per patch — adequate coverage.
      sample_density: 0.015

      normal_sample_density: 1.0

      # Curved surfaces produce slightly non-parallel contact pairs —
      # relax lateral deviation a bit compared to flat-face workpieces.
      max_lateral_deviation: 0.04   # 40mm
      alignment_threshold: 0.90     # slightly looser for curved normals

    # =========================================================================
    # Orientation Finding
    # =========================================================================
    orientation:
      finger_length: 0.20            # 200mm
      finger_radius: 0.02            # 20mm (half of 40mm finger width)

      # Arc patches on a cylinder have curved edges — more candidates needed
      # to find the best approach angle around a circular boundary.
      max_edge_candidates: 8
      dual_seed_dedup_tolerance_deg: 5.0   # slightly wider for curved edges
      max_edges_per_contact: 0             # unlimited

      # Five offsets give good coverage around arc edge seeds.
      angle_offsets: [-30.0, -15.0, 0.0, 15.0, 30.0]

      stop_on_first_valid: false
      collision_tolerance: 0.001     # 1mm

    # =========================================================================
    # Kissing Surface
    # =========================================================================
    kissing:
      # Bottom flat face will be ~100% in contact with the ground plane
      # and will be fully banned — correct behaviour.
      contact_threshold: 0.8

    # =========================================================================
    # FCL
    # =========================================================================
    fcl:
      enabled: true
      # Tighter triangulation for the curved surface to avoid false collisions
      # on the arc patches produced by ShapeRefiner.
      triangulation_deflection: 0.0005   # 0.5mm — finer than flat-face configs

    # =========================================================================
    # Output
    # =========================================================================
    output:
      # Expect 0 grasps for this geometry with this gripper.
      # Set max_grasps high so that if geometry or gripper changes, results
      # are not accidentally truncated.
      max_grasps: 100
      min_quality: 0.0
