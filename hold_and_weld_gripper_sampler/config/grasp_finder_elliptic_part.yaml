# Elliptic part without exclusion zones.
# Intended pose in metres: centred at (1.2, 0, 0.125), resting on z = 0.
/**:
  ros__parameters:
    frame_id: 'world'

    primary:
      # Sampler-specific copy of elliptic_part.step, scaled by 0.001.
      # Its raw OCCT coordinates match ROS metres (0.60 x ~0.431 x 0.25).
      # Compensates for the current loader's default millimetre transfer units.
      step_path: 'config/elliptic_part_sampler.step'
      transform:
        translation:
          x: 1.2
          y: 0.0
          z: 0.125
        rotation:
          x: 0.0
          y: 0.0
          z: 0.0
          w: 1.0

    gripper:
      urdf_path: 'config/test_gripper.urdf'

    secondaries:
      - id: 'ground_plane'
        type: 'ground_plane'
        size_x: 4.0
        size_y: 4.0
        z_position: 0.0

    # Reduce face splitting and curvature analysis for this complex part.
    shape_refiner:
      enabled: true
      max_cylinder_radius: 0.100  # Currently unused by the refiner.
      max_arc_length: 1.0
      enclave_area_ratio: 0.0
      enclave_angle_threshold: 45.0
      max_face_area_ratio: 1.0
      planarity_tolerance_deg: 3.0
      inflection_samples: 5

    sampling:
      min_angle_deg: 160.0
      max_angle_deg: 180.0

      min_gripper_opening: 0.06
      max_gripper_opening: 0.36

      sample_density: 0.01

      normal_sample_density: 1.0
      # Curved-surface pairing settings, matching the cylinder example.
      max_lateral_deviation: 0.05
      alignment_threshold: 0.10

    orientation:
      finger_length: 0.2
      finger_radius: 0.02

      max_edge_candidates: 5
      dual_seed_dedup_tolerance_deg: 3.0
      max_edges_per_contact: 0

      angle_offsets: [-15.0, 0.0, 15.0]

      stop_on_first_valid: false
      collision_tolerance: 0.001
      debug_full_sweep: false
      debug_sweep_step_deg: 10.0

      randomize_seeds: true

    jaw_clearance:
      # Cylinder on the jaw axis ending at the TCP, covering the open mouth:
      # radius = grip_distance / 2 + clearance_margin, length = orientation.finger_length.
      # Rejects candidates with a secondary or an exclusion volume in or beside the
      # mouth. The gripped part and the ground are not tested.
      enabled: true
      clearance_margin: 0.005

    kissing:
      contact_threshold: 0.8
      collision_tolerance: 0.001

    fcl:
      enabled: true
      triangulation_deflection: 0.001

    output:
      max_grasps: 50
      min_quality: 0.0
