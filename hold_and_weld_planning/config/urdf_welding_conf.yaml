# ── HC10DT + GP8L: robotiq_cube held on the small table ──────────────────────────
# Must match the placed poses in hold_and_weld_bringup objects.yaml. OCCT: the mesh
# extractor finds no part edge on this 0.10 m cube at the parameters below.
workpiece:
  mode: occt
  main_part:
    main_path: "package://hold_and_weld_description/urdf/environment/small_table.urdf.xacro"
    world_pose:
      xyz:
      - 0.9
      - 0.0
      - 0.25
      rpy:
      - 0
      - 0
      - 0
  secondary_part:
    secondary_path: "package://hold_and_weld_description/urdf/environment/robotiq_cube.urdf.xacro"
    world_pose:
      xyz:
      - 0.9
      - 0.0
      - 0.55
      rpy:
      - 0
      - 0
      - 0

