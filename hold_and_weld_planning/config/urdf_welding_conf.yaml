# Every tuning key goes under parameters (see PARAMS.md); under workpiece it is
# silently ignored.
parameters:
  # ── Planner ────────────────────────────────────────────────────────────────
  gap: 0.04
  work_angle_deg: 45.0
  travel_angle_deg: 5.0
  waypoint_spacing: 0.01

  # ── Contact boundary tuning ────────────────────────────────────────────────
  # Measured on the elliptic mesh scene (refine 40, epsilon 0.002, 1098.87 mm analytic):
  # 0.10 -> +4.71 mm, 0.50 -> +36.31 mm. The seam count (8) does not change with
  # it; that fragmentation comes from PathCreator._split_on_contact_type.
  near_contact_edge_fraction: 0.1
  # The elliptic mesh scene's -y overhang crosses the plate rim in only 2 edges (20mm each), a
  # 3-vertex chain the default of 4 discards, leaving the seam open with a ~46mm hole there.
  min_loop_points: 3
  #stitch_gap_factor: 3.0

  # ── Mesh intersection ──────────────────────────────────────────────────────
  epsilon: 0.002
  # Last value measured clean on the elliptic mesh scene; the upper bound is in PARAMS.md.
  refine_iterations: 40

  # ── Path classification overrides, at their defaults ───────────────────────
  # path_tolerance: 0.001
  # arc_strictness: 0.5
  # min_arc_angle_deg: 15.0
  # max_line_length: 0.5
  # max_arc_length: 0.5
  # max_ptp_length: 0.1
