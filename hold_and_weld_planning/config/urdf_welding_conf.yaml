parameters:
  # ── Planner ────────────────────────────────────────────────────────────────
  gap_mm: 40.0
  work_angle_deg: 45.0
  travel_angle_deg: 5.0
  waypoint_spacing_mm: 10.0

  # ── Contact boundary tuning ────────────────────────────────────────────────
  # Both are multipliers on mesh-derived lengths, not absolute distances, so
  # they do not need changing when part size changes. Defaults are measured.
  #
  # near_contact_edge_fraction: how far off the other mesh a sharp edge may sit
  #   and still count as seam, as a fraction of this mesh's MEDIAN edge length
  #   (on top of epsilon). Guards against welding a part's own edges away from
  #   the joint — the rim of a cylinder where it overhangs the plate is a real
  #   90-degree edge but is not a weld.
  #
  #   The slack exists to absorb TESSELLATION error, measured at 0.051mm here,
  #   so keep it small. Swept on this scene at refine 40 / epsilon 0.002
  #   against 1098.87mm analytic:
  #
  #       ncf    total_mm    err_mm    worst stray off plate
  #       0.50    1135.18    +36.31           5.076mm
  #       0.20    1126.35    +27.48           3.273mm
  #       0.10    1103.58     +4.71           2.653mm
  #       0.05    1101.93     +3.06           2.280mm
  #
  #   At 0.50 the bound is 2.00 + 0.5*6.25 = 5.12mm and the strays came in at
  #   5.076mm — admitted with 0.04mm to spare. The floor on stray distance is
  #   epsilon itself (~2mm), not this, so below ~0.05 there is nothing left to
  #   win. NOTE this does NOT change the segment COUNT: 8 seams at every value
  #   above. That fragmentation is edge-flag flicker driving
  #   PathCreator._split_on_contact_type and needs code, not config.
  #
  #   Only meaningful when the mesh resolves the joint — on a 12-face box the
  #   median edge is 500mm and even a small fraction admits almost anything.
  #   If stray far-from-joint seams appear, refine the mesh first.
  #
  # stitch_gap_factor: endpoint gap below which two chain pieces from
  #   DIFFERENT meshes are joined, as a multiple of the local sampling density
  #   of the two pieces. The meshes share no vertices, so a handoff gap of
  #   about one segment is expected. Raise if pieces that clearly belong to one
  #   seam stay separate; lower if unrelated seams get spliced end to end.
  near_contact_edge_fraction: 0.1
  #stitch_gap_factor: 3.0

  # ── Mesh intersection ──────────────────────────────────────────────────────
  epsilon: 0.002
  # contact_boundary defaults to 16; 40 is the last value measured clean here.
  #
  # Refinement now buys PRECISION, not just coverage: the kernel refinement
  # slides each point onto the half level set of contact coverage, and that
  # level set approximates the true rim better the more triangles describe
  # it. Below refine ~20 the kernel is worse than snapping to a vertex; see
  # PARAMS.md (Sub-vertex refinement) for the measured error curve. Cost is
  # ~4x per doubling.
  #
  # HARD UPPER BOUND, do not exceed without re-checking: wall row height is
  # 250mm/refine and the bottom row's centroid sits at h/3, so wall faces get
  # wrongly marked as contact once h/3 <= epsilon, i.e.
  #     refine >= 250 / (3 * epsilon_mm) = 41.7 at epsilon 2mm.
  # Measured clean at 40, broken at 42 (climb 1.984mm, sharp edges 1870 => 969).
  # _validate_epsilon already warns at 40 — that warning is the cliff being
  # 4% away, not an error. Raising refine REQUIRES lowering epsilon.
  refine_iterations: 40

  # ── Path classification (PathCreator) ──────────────────────────────────────
  # These are the keys that actually decide line vs arc vs PTP. All are shown
  # at their built-in defaults (mesh/path_creator.py:62-72); uncomment to
  # override. Cascade: fit within path_tolerance_mm => LINE (preferred), fit
  # within arc_strictness x that AND subtend >= min_arc_angle_deg AND consume
  # 1.5x the run a line would => ARC, else PTP. The asymmetry is deliberate —
  # a false PTP is safe, a false arc breaks the torch.
  #
  # path_tolerance_mm: 1.0     # master fit tolerance
  # arc_strictness: 0.5        # arc tolerance = this x path_tolerance_mm
  # min_arc_angle_deg: 15.0    # below this an arc is not worth calling an arc
  # max_line_length: 0.5       # metres; hard split, not geometric
  # max_arc_length: 0.5        # metres; hard split. This is why a 706.79mm
  #                            # semicircle comes out as 2 arcs of 353.39mm.
  # max_ptp_length: 0.1        # metres
  #
  # num_smooth_points is NOT read in mesh mode — it is OCCT-only
  # (occt/seam_extractor_occt.py:155, points per B-spline curve). job_planner
  # sets a default of 100 and seam_generator prints it, but nothing under
  # mesh/ ever reads it. It has no effect on this config.
