# ── Final Boss: Cylinder-on-Workpiece ─────────────────────────────────────────
/**:
  ros__parameters:
    base_link:
      urdf_path: 'urdf/environment/workpiece.urdf.xacro'
      id: 'base_link'
      spawn_name: 'workpiece_cylinder'
      pose:
        x: 1.2
        y: -0.5
        z: 0.65
      orientation:
        x: 0.0
        y: 0.0
        z: 0.0
        w: 1.0

    child_link:
      urdf_path: 'urdf/environment/cylinder.urdf.xacro'
      id: 'child_link'
      spawn_name: 'cylinder_final_boss'
      pose:
        x: 1.6
        y: -0.5
        z: 0.125
      end_pose:
        position:
          x: 1.6
          y: -0.5
          z: 0.925
        orientation:
          x: 0.0
          y: 0.0
          z: 0.0
          w: 1.0

    frame_id: 'world'

