# Single robot gripper system controller configuration

controller_manager:
  ros__parameters:
    update_rate: 100

    robot1_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# Robot 1: Rail + Arm combined (7 joints)
robot1_arm_controller:
  ros__parameters:
    joints:
      - robot1_rail_joint
      - robot1_joint_1
      - robot1_joint_2
      - robot1_joint_3
      - robot1_joint_4
      - robot1_joint_5
      - robot1_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

# Gripper controller (2 joints)
gripper_controller:
  ros__parameters:
    joints:
      - robot1_left_finger_joint
      - robot1_right_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

joint_state_broadcaster:
  ros__parameters: {}
