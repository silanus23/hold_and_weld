welder_group_name: "robot2_gp25_welder_arm"

# Safety position the welder arm moves to before the gripper executes its
# pick-and-place sequence.  Tune joint values (radians) to match the cell.
safety_pose:
  velocity_scaling:  0.3
  planning_time_sec: 5.0
  joint_positions:
    robot2_joint_1_s:  0.02367382699844696
    robot2_joint_2_l: -0.26463564871997514
    robot2_joint_3_u:  0.6452811253697497
    robot2_joint_4_r:  0.02990070287091831
    robot2_joint_5_b: -0.9101291555788971
    robot2_joint_6_t:  6.26474330075644

# Motion parameters
approach_offset_z: 0.1          # Offset above seam start for approach (meters)
retract_offset_z: 0.15          # Offset above seam end for retract (meters)
cartesian_path_threshold: 0.95  # Minimum fraction of path that must be achievable (0.0-1.0)
cartesian_step_size: 0.01       # Step size for Cartesian path computation (meters)
velocity_scaling: 0.3           # Velocity scaling factor (0.0-1.0)
manipulability_threshold: 1e-6  # Yoshikawa manipulability singularity threshold

# Retry parameters
max_ompl_planning_attempts: 3        # Maximum OMPL planning attempts for approach
max_approach_validation_retries: 3   # Maximum validation retries (check if approach can reach seam)
max_cartesian_retries: 2             # Maximum attempts for Cartesian path execution
use_approach_validation: false

start_pose:
  position:
    x: 1.2
    y: 0.3
    z: 0.625
  orientation:
    x: 0.0
    y: 0.7071068
    z: 0.0
    w: 0.7071068

# JSON file path (optional)
# If not specified, will auto-load latest JSON from hold_and_weld_planning/generated/
# json_file: "/path/to/specific/seams.json"
