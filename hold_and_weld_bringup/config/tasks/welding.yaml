welder_group_name: "robot2_welder_arm"

# Safety position the welder arm moves to before the gripper executes its
# pick-and-place sequence.  Tune joint values (radians) to match the cell.
safety_pose:
  velocity_scaling:  0.3
  planning_time_sec: 5.0
  joint_positions:
    robot2_joint_1: -0.02866902375860982
    robot2_joint_2:  0.4554804839676735
    robot2_joint_3:  2.026569863838492
    robot2_joint_4: -0.028703125373702794
    robot2_joint_5: -1.5711409353884473
    robot2_joint_6:  0.0

# Motion parameters
approach_offset_z: 0.1
retract_offset_z: 0.15
cartesian_path_threshold: 0.95
cartesian_step_size: 0.01
velocity_scaling: 0.3
manipulability_threshold: 1e-6

# Retry parameters
max_ompl_planning_attempts: 1
max_approach_validation_retries: 3
max_cartesian_retries: 2
use_approach_validation: false

# JSON file path (optional)
# If not specified, will auto-load latest JSON from hold_and_weld_planning/generated/
# json_file: "/path/to/specific/seams.json"
