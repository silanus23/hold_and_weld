gripper:
  # robotiq_2f_140 travel is [0, 0.064267] per finger; pad gap is 2*position,
  # so fully open clears the 0.10m cube by 14mm per side and contact is at 0.05;
  # close 1mm per side past contact to squeeze it.
  open_position: 0.064267
  close_position: 0.049
  attach_link: robot1_gripper_base
  touch_links:
    - robot1_tool0
    - robot1_link_6_t
    - robot1_flange
    - robot1_gripper_base
    - robot1_left_finger
    - robot1_right_finger
targets:
  - target_id: "child_link"
    approach_pose:
      position:
        x: 1.2
        y: 0.3
        z: 0.55
      orientation:
        x: 0.0
        y: 0.7071068
        z: 0.0
        w: 0.7071068
    pick_pose:
      position:
        x: 1.2
        y: 0.3
        z: 0.3282
      orientation:
        x: 0.0
        y: 0.7071068
        z: 0.0
        w: 0.7071068
    retract_pose:
      position:
        x: 1.2
        y: -0.5
        z: 1.325
      orientation:
        x: 0.0
        y: 0.7071068
        z: 0.0
        w: 0.7071068
    place_pose:
      position:
        x: 1.2
        y: -0.5
        z: 1.1382
      orientation:
        x: 0.0
        y: 0.7071068
        z: 0.0
        w: 0.7071068
