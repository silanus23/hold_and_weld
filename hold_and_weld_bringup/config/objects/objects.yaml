# ── HC10DT + GP8L: robotiq_cube held on the small table ──────────────────────────
# end_pose must match the secondary_part pose in hold_and_weld_planning
# urdf_welding_conf.yaml.
/**:
   ros__parameters:
     base_link:
       urdf_path: 'urdf/environment/small_table.urdf.xacro'
       id: 'base_link'
       spawn_name: 'small_table'
       pose:
         x: 0.9
         y: 0.0
         z: 0.25
       orientation:
         x: 0.0
         y: 0.0
         z: 0.0
         w: 1.0

     child_link:
       urdf_path: 'urdf/environment/robotiq_cube.urdf.xacro'
       id: 'child_link'
       spawn_name: 'robotiq_cube_small_table'
       pose:
         x: 0.5
         y: 0.6
         z: 0.05
       end_pose:
         position:
           x: 0.9
           y: 0.0
           z: 0.55
         orientation:
           x: 0.0
           y: 0.0
           z: 0.0
           w: 1.0

     frame_id: 'world'

